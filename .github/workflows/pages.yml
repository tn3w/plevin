name: Pages

on:
  workflow_run:
    workflows: [Build and release database]
    types: [completed]
  push:
    branches: [master]
    paths: [site/**, js/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Build the reader the page reads with
        working-directory: js
        run: |
          npm ci
          npm run build
          mkdir -p ../site/plevin
          cp dist/*.js ../site/plevin/

      - name: Rehost the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 30 --json tagName --jq \
            '[.[].tagName | select(test("^[0-9]{4}(\\.[0-9]{2}){2}(\\.[0-9]+)?$"))][0]')
          mkdir -p site/db
          gh release download "$tag" --pattern '*.plv' --dir site/db
          jq -n --arg tag "$tag" --argjson files \
            "$(cd site/db && ls *.plv | jq -R . | jq -s .)" \
            '{tag: $tag, files: $files, built: (now | todate)}' > site/db/index.json
          ls -la site/db

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
