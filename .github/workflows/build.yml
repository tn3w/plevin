name: Build and release database

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AGENT: 'plevin-builder (https://github.com/tn3w/plevin)'
    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Download sources
        working-directory: builder
        env:
          IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: |
          mkdir -p inputs && cd inputs
          geonames=https://download.geonames.org/export
          natural_earth=https://naciscdn.org/naturalearth/10m/cultural
          iso_codes=https://salsa.debian.org/iso-codes-team/iso-codes/-/raw/main/data
          caida=https://publicdata.caida.org/datasets
          get() { curl -fsSL -A "$AGENT" --retry 6 --retry-all-errors --retry-delay 15 "$@"; }
          newest() { get "$caida/$1/" | grep -oE "[0-9]{8}\.$2" | sort | tail -1; }
          for url in \
            $geonames/dump/admin1CodesASCII.txt \
            $geonames/dump/admin2Codes.txt \
            $geonames/dump/cities500.zip \
            $geonames/zip/allCountries.zip \
            $natural_earth/ne_10m_admin_0_countries.zip \
            $natural_earth/ne_10m_admin_1_states_provinces.zip \
            $iso_codes/iso_3166-2.json \
            https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-City.mmdb \
            https://ftp.ripe.net/pub/stats/ripencc/nro-stats/latest/nro-delegated-stats \
            https://ftp.ripe.net/ripe/asnames/asn.txt \
            https://console.rpki-client.org/vrps.csv \
            https://data.ris.ripe.net/rrc00/latest-bview.gz \
            https://github.com/tn3w/asn-abuse/releases/latest/download/abuse-contacts.tsv \
            $caida/as-organizations/$(newest as-organizations 'as-org2info\.txt\.gz') \
            $caida/as-relationships/serial-2/$(newest as-relationships/serial-2 'as-rel2\.txt\.bz2')
          do
            get -O "$url"
          done
          ripe=https://ftp.ripe.net/ripe/dbase/split
          apnic=https://ftp.apnic.net/apnic/whois
          keys='^(inetnum|inet6num|netname|descr|country|org|organisation|org-name|geofeed):'
          keys="$keys|^remarks:.*[Gg]eo[Ff]eed|^$"
          whois() { get "$2" | gzip -dc | grep -aE "$keys" > "$1"; }
          whois ripe_inetnum $ripe/ripe.db.inetnum.gz
          whois ripe_inet6num $ripe/ripe.db.inet6num.gz
          whois ripe_organisation $ripe/ripe.db.organisation.gz
          whois apnic_inetnum $apnic/apnic.db.inetnum.gz
          whois apnic_inet6num $apnic/apnic.db.inet6num.gz
          whois apnic_organisation $apnic/apnic.db.organisation.gz
          whois afrinic_db https://ftp.afrinic.net/dbase/afrinic.db.gz
          get https://ftp.lacnic.net/lacnic/dbase/lacnic.db.gz | gzip -dc > lacnic_db
          dbip=https://download.db-ip.com/free/dbip-city-lite
          get -o dbip-city-lite.mmdb.gz "$dbip-$(date -u +%Y-%m).mmdb.gz" ||
            get -o dbip-city-lite.mmdb.gz "$dbip-$(date -u -d '-1 month' +%Y-%m).mmdb.gz"
          get -o DB11LITEBINIPV6.zip \
            "https://www.ip2location.com/download/?token=$IP2LOCATION_TOKEN&file=DB11LITEBINIPV6"
          for endpoint in net org netixlan; do
            sleep 30
            get --retry 8 --retry-delay 60 -o "peeringdb_$endpoint.json" \
              -H "Authorization: Api-Key $PEERINGDB_API_KEY" \
              "https://www.peeringdb.com/api/$endpoint"
          done
          for archive in *.zip; do unzip -oq "$archive"; done
          gunzip -f *.gz && bunzip2 -f *.bz2 && rm *.zip
          mv latest-bview bview
          for dated in *.as-*.txt; do mv "$dated" "${dated#*.}"; done

      - name: Download geofeeds
        working-directory: builder/inputs
        run: |
          { grep -ahiE '^(geofeed|remarks):' ripe_* apnic_* afrinic_db |
              grep -oE "https?://[^][:space:]\"'<>[]+"
            echo https://milacnic.lacnic.net/lacnic/geofeeds; } | sort -u > geofeed_urls
          mkdir -p held
          nl -ba geofeed_urls | xargs -P 64 -L 1 bash -c 'curl -fsSL -m 25 \
            --max-filesize 67108864 -A "$AGENT" -o "held/$0" "$1" 2>/dev/null || true'
          nl -ba geofeed_urls | while read -r at url; do
            [ -s "held/$at" ] || continue
            case "$(file -b --mime-type "held/$at")" in
              application/gzip | application/x-gzip) gzip -dc "held/$at" ;;
              text/*) cat "held/$at" ;;
            esac | awk -v url="$url" -F, 'NF > 3 && !/^#/ { print url "," $0 }'
          done > geofeeds
          rm -rf held geofeed_urls
          echo "geofeeds: $(wc -l < geofeeds) rows"

      - name: Download feeds
        env:
          IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        working-directory: builder/inputs
        run: |
          feeds=../data/feeds.json
          jq -r '.[] | .name + " " + .url' $feeds |
            sed "s|{IP2LOCATION_TOKEN}|$IP2LOCATION_TOKEN|" |
            xargs -P 8 -L 1 bash -c 'auth=()
              [[ $1 == https://api.github.com/* ]] &&
                auth=(-H "Authorization: Bearer $GH_TOKEN")
              curl -fsSL -A "$AGENT" "${auth[@]}" --retry 6 --retry-all-errors \
                --retry-delay 15 -o "$0" "$1" || echo "missed $0"'
          for name in $(jq -r '.[].name' $feeds); do
            case "$(file -b --mime-type "$name" 2>/dev/null)" in
              application/zip)
                rm -rf opened && unzip -qo "$name" -d opened
                mv "$(ls -S opened/* | head -1)" held && rm -rf opened ;;
              application/gzip | application/x-gzip)
                gzip -dc "$name" > held ;;
              *) continue ;;
            esac
            mv held "$name"
          done
          jq -r '.[] | select(.hosts) | .name + " " + .hosts' $feeds |
            while read -r name hosts; do
              [ -s "$name" ] || continue
              grep -oE "$hosts" "$name" | sort -u |
                xargs -P 16 -I {} sh -c 'getent ahosts {} || true' |
                awk '{ print $1 }' | sort -u > held
              mv held "$name"
            done

      - name: Build database
        working-directory: builder
        run: |
          cargo build --release
          ./target/release/plevin-builder full place+metro network \
            abuse.service+abuse.provider+abuse.level place.country.code \
            blocklist.netset | tee build.log

      - name: Publish release
        working-directory: builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%Y.%m.%d)
          same=$(gh release list --limit 100 --json tagName --jq \
            "[.[].tagName | select(startswith(\"$day\"))] | length")
          tag=$day
          if [ "$same" -gt 0 ]; then tag="$day.$((same + 1))"; fi
          {
            echo "Location, network and abuse information for any IP address in one"
            echo "offline file, built $(date -u '+%Y-%m-%d %H:%M UTC') from"
            echo "$(jq length data/feeds.json) feeds, 26 source files and $(wc -l < inputs/geofeeds)"
            echo "operator geofeed rows."
            echo
            echo "| file | size | bytes |"
            echo "|---|---|---|"
            for held in dist/*.plv dist/blocklist.netset; do
              printf '| `%s` | %s | %s |\n' "${held#dist/}" \
                "$(du -h "$held" | cut -f1)" "$(stat -c %s "$held")"
            done
            echo
            echo '```bash'
            for held in dist/*.plv dist/blocklist.netset; do
              echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/${held#dist/}"
            done
            echo '```'
            echo
            grep -E "^\[" build.log | sed 's/^/    /'
            echo
            echo "<details><summary>Sections</summary>"
            echo
            echo '```'
            grep -vE "^\[" build.log
            echo '```'
            echo
            echo "</details>"
          } > notes.md
          gh release create "$tag" dist/*.plv dist/blocklist.netset --title "$tag" --notes-file notes.md

      - name: Delete dated releases beyond the newest seven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=$(gh release list --limit 100 --json tagName --jq \
            '[.[].tagName | select(test("^[0-9]{4}(\\.[0-9]{2}){2}(\\.[0-9]+)?$"))][7:][]')
          for tag in $stale; do
            gh release delete "$tag" --yes
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>/dev/null ||
              echo "tag $tag already gone"
          done
