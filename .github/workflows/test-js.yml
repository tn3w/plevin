name: Test JS

on:
  push:
    branches: [master]
    paths: [js/**, .github/workflows/test-js.yml]
  pull_request:
    paths: [js/**, .github/workflows/test-js.yml]
  workflow_call:

defaults:
  run:
    working-directory: js

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci

      - name: Download the newest database
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 30 --json tagName --jq \
            '[.[].tagName | select(test("^[0-9]{4}(\\.[0-9]{2}){2}(\\.[0-9]+)?$"))][0]')
          gh release download "$tag" --pattern plevin.plv --dir ..

      - run: npm run build
      - run: npm test

  oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Read the built package on the oldest Node the package claims
        run: |
          node --input-type=module -e "
          import { File, Plevin, open } from './dist/index.js';
          for (const held of [File, Plevin, open]) {
            if (typeof held !== 'function') throw new Error('missing an export');
          }
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
